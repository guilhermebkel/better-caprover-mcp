name: Release

# Why: a release is started by hand on main, so the version number is chosen by a person and the tag, the package,
# the image and the GitHub Release all come from one commit. Same shape as the scenec project (ADR 0012).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch, minor or major; none releases the current version as is (first release)"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, none]

concurrency:
  group: main-writes
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Bump the version in package.json
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" != "none" ]; then
            pnpm version "$BUMP" --no-git-tag-version
          fi
      - id: version
        name: Read the version and check if it is released already
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            if [ "$BUMP" != "none" ]; then
              echo "v$VERSION is already released; pick patch, minor or major." >&2
              exit 1
            fi
            echo "v$VERSION is already tagged; resuming: the tag and push are skipped."
            echo "IS_TAGGED=true" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set the version and the date on the landing page
        run: node scripts/site-version.mjs "$VERSION"
      - name: Check everything the release ships
        run: pnpm check
      - name: Commit, tag and push
        if: env.IS_TAGGED != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json site/
          if ! git diff --cached --quiet; then
            git commit -m "release: v$VERSION [skip ci]"
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main "v$VERSION"
      - name: Publish to npm with provenance
        run: |
          if npm view "better-caprover-mcp@$VERSION" version > /dev/null 2>&1; then
            echo "better-caprover-mcp@$VERSION is already on npm (published by hand); skipping."
          else
            npm publish --provenance --access public
          fi
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The GitHub Release v$VERSION already exists; skipping."
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
          fi
      # Why: a push made with the workflow token does not start other workflows, so the landing page is published on purpose.
      - name: Publish the landing page with the new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  image:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/guilhermebkel/better-caprover-mcp
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
