name: CI

on:
  push:
    branches: [main]
  pull_request:

# Why: the jobs run in parallel and together run everything `pnpm check` runs, plus the Docker path; CI never uses lint-staged.
jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}
      - run: pnpm typecheck
      # Why: ESLint's content cache is keyed by the config, so a rule or config change re-lints every file even on a hit; Oxlint keeps no cache.
      - uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', '.oxlintrc.json', 'scripts/eslint-local-rules.mjs', 'tsconfig.json') }}
      - run: pnpm lint

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm sdk:drift

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke
      # Why: this is the way a user runs it: the packed tarball through npx, not the folder.
      - run: npm pack --silent
      - run: pnpm smoke -- npx --yes --package ./better-caprover-mcp-0.0.0.tgz better-caprover-mcp

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: docker build -t better-caprover-mcp:ci .
      # Why: `-i` is what a stdio client passes; without it the server gets no input and exits.
      - run: node scripts/package-smoke.mjs -- docker run -i --rm better-caprover-mcp:ci

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Why: this is CapRover's own install command; MAIN_NODE_IP_ADDRESS skips its search for a public address.
      - name: Start CapRover
        run: >
          docker run -d --name captain-install --network host -e ACCEPTED_TERMS=true
          -e MAIN_NODE_IP_ADDRESS=127.0.0.1 -v /var/run/docker.sock:/var/run/docker.sock
          -v /captain:/captain caprover/caprover
      # Why: CapRover answers the login before it is ready, and only the system info says "not ready yet"; it also
      # restarts once as a service, so the wait needs ten good answers of the system info in a row.
      - name: Wait for CapRover to stay up
        run: |
          good=0
          for attempt in $(seq 1 240); do
            token=$(curl -s -X POST localhost:3000/api/v2/login -H 'content-type: application/json' -H 'x-namespace: captain' -d '{"password":"captain42"}' | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            if [ -n "$token" ] && curl -s localhost:3000/api/v2/user/system/info -H "x-captain-auth: $token" -H 'x-namespace: captain' | grep -q '"status":100'; then
              good=$((good + 1))
            else
              good=0
            fi
            if [ "$good" -ge 10 ]; then
              exit 0
            fi
            sleep 2
          done
          docker service ls
          docker logs captain-install
          exit 1
      - run: pnpm test:integration
