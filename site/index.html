<!-- 2. GUARDRAILS -->
<section id="guardrails">
  <div class="container">
    <div data-reveal>
      <h2 class="h2">Guardrails in code,<br><span class="dim">not in the prompt.</span></h2>
      <p class="lede">A CapRover password is full access. Asking the model to be careful is a hope. Here the server enforces it before anything reaches CapRover.</p>
    </div>
    <div class="rows">
      <article class="row">
        <h3>Read-only by default</h3>
        <p>Write tools aren't registered until you start the server in another mode. The mode is an env var and changes only on restart, so the agent can't promote itself.</p>
        <code class="tag">CAPROVER_MCP_MODE</code>
      </article>
      <article class="row">
        <h3>Preview before you commit</h3>
        <p>Any change accepts a dry run. You get what would happen, and no write call goes to CapRover.</p>
        <code class="tag">dry_run</code>
      </article>
      <article class="row">
        <h3>Deleting needs a token</h3>
        <p>delete_app first returns a preview and a single-use token. It lasts 5 minutes and is tied to that exact call.</p>
        <code class="tag">delete_app</code>
      </article>
      <article class="row">
        <h3>Secrets stay out</h3>
        <p>Env var values are never returned, only whether they're set. The password is masked in logs and errors, and log lines show [REDACTED].</p>
        <code class="tag">isSet · [REDACTED]</code>
      </article>
    </div>
  </div>
</section>

<!-- 3. TRANSCRIPT -->
<section id="confirm">
  <div class="container split">
    <div data-reveal>
      <h2 class="h2">Deleting takes two calls <span class="dim">and a yes.</span></h2>
      <p class="lede">The first delete_app call deletes nothing. The agent has to bring you the preview, get your answer, and call again with the token.</p>
      <ul class="facts">
        <li><svg class="ico"><use href="#i-check"/></svg><span><b>Single use.</b> A spent token can't be replayed.</span></li>
        <li><svg class="ico"><use href="#i-check"/></svg><span><b>Five minutes.</b> Then it expires.</span></li>
        <li><svg class="ico"><use href="#i-check"/></svg><span><b>Bound to the call.</b> A token from another call is refused.</span></li>
      </ul>
    </div>

    <div class="term" id="term">
      <div class="term__bar">
        <div class="tabs" role="tablist" aria-label="Scenario">

          <button class="tab" role="tab" id="t-env" aria-selected="false" aria-controls="s-env" tabindex="-1" type="button">Preview a change</button>
        </div>
        <span class="term__spacer"></span>
        <span class="pill">illustrative</span>
        <button class="iconbtn" id="replay" type="button" aria-label="Replay"><svg class="ico"><use href="#i-replay"/></svg></button>
      </div>
      <div class="term__body">
        <div class="term__panel" id="s-del" role="tabpanel" aria-labelledby="t-del">
          <div class="ln ln--you"><span class="ln__who">you</span><span class="ln__txt">Delete the app staging-old.</span></div>
          <div class="ln ln--agent"><span class="ln__who">agent</span><span class="ln__txt"><code class="cmd">→ delete_app staging-old</code></span></div>
          <div class="ln ln--server"><span class="ln__who">server</span><span class="ln__txt">Preview only. This would remove staging-old. Nothing was deleted.<br><span class="tok">token · single use · 5 min</span></span></div>
          <div class="ln ln--agent"><span class="ln__who">agent</span><span class="ln__txt">This removes staging-old. Do you confirm?</span></div>
          <div class="ln ln--you"><span class="ln__who">you</span><span class="ln__txt">Yes.</span></div>
          <div class="ln ln--agent"><span class="ln__who">agent</span><span class="ln__txt"><code class="cmd">→ delete_app staging-old · user_confirmed · token</code></span></div>
          <div class="ln ln--server"><span class="ln__who">server</span><span class="ln__txt">Deleted. The token is spent.</span></div>
          <div class="ln ln--agent ln--sep"><span class="ln__who">agent</span><span class="ln__txt"><code class="cmd">→ delete_app · same token again</code></span></div>

          <div class="ln ln--agent"><span class="ln__who">agent</span><span class="ln__txt">This adds LOG_LEVEL to api. Apply it?</span></div>

          <div class="ln ln--agent"><span class="ln__who">agent</span><span class="ln__txt"><code class="cmd">→ set_env_vars api · LOG_LEVEL=debug</code></span></div>
          <div class="ln ln--server"><span class="ln__who">server</span><span class="ln__txt">Done. LOG_LEVEL isSet: true. Values are never sent back.</span></div>

<!-- 4. TOOLS -->
<section id="tools">
  <div class="container">
    <div data-reveal>
      <h2 class="h2"><!-- operations:count -->71<!-- /operations:count --> operations, <span class="dim">and no “send any request”.</span></h2>
      <p class="lede">There is no raw-request tool, on purpose. Each operation has its own schema and risk level, and the mode decides which ones exist. These are the main ones; the README lists all of them.</p>
    </div>

    <div class="tg">
      <div class="tg__head"><h3>Read <span class="num">7</span></h3><p>registered from readonly</p></div>
      <ul>
<li class="tr tr--0"><code class="tr__name">get_overview</code><p class="tr__desc">CapRover version, root domain, app count, and what this server can do.</p><span class="dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="sr-only">Available from readonly</span></li>
<li class="tr tr--0"><code class="tr__name">list_apps</code><p class="tr__desc">Every app on the server.</p><span class="dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="sr-only">Available from readonly</span></li>
<li class="tr tr--0"><code class="tr__name">get_app</code><p class="tr__desc">Details for one app.</p><span class="dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="sr-only">Available from readonly</span></li>
<li class="tr tr--0"><code class="tr__name">get_app_runtime</code><p class="tr__desc">Live state of an app. Needs a CapRover version with that endpoint; 1.15.5 doesn't have it.</p><span class="dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="sr-only">Available from readonly</span></li>
<li class="tr tr--0"><code class="tr__name">get_app_logs</code><p class="tr__desc">Last lines of the running app. Secrets come back as [REDACTED].</p><span class="dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="sr-only">Available from readonly</span></li>
<li class="tr tr--0"><code class="tr__name">get_build_logs</code><p class="tr__desc">Last lines of the latest build, with the same redaction.</p><span class="dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="sr-only">Available from readonly</span></li>
<li class="tr tr--0"><code class="tr__name">list_one_click_apps</code><p class="tr__desc">The one-click templates you can install.</p><span class="dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="sr-only">Available from readonly</span></li>
      </ul>
    </div>
    <div class="tg">

<li class="tr tr--1"><code class="tr__name">set_env_vars</code><p class="tr__desc">Set and remove variables from KEY=value lines. The rest are kept.</p><span class="dots" aria-hidden="true"><i class=""></i><i class="on"></i><i class="on"></i></span><span class="sr-only">Available from operate</span></li>

  <div class="container">
    <div data-reveal>
      <h2 class="h2">One command, <span class="dim">then ask.</span></h2>
      <p class="lede">Start in readonly. Ask which apps run a latest tag. Raise the mode when you need writes.</p>
    </div>

    <div class="install">
      <div>
        <div class="tabs" role="tablist" aria-label="Mode">
          <button class="tab" role="tab" id="i-claude" aria-selected="true" aria-controls="p-claude-wrap" type="button">Coding Agent</button>
          <button class="tab" role="tab" id="i-docker" aria-selected="false" aria-controls="p-docker-wrap" tabindex="-1" type="button">Your own server</button>
        </div>
        <div class="panel codebox" id="p-claude-wrap" role="tabpanel" aria-labelledby="i-claude">
          <pre class="code" id="p-claude">{
  "mcpServers": {
    "caprover": {
      "command": "npx",
      "args": ["-y", "better-caprover-mcp"],
      "env": {
        "CAPROVER_URL": "https://captain.your-domain.com",
        "CAPROVER_PASSWORD": "your CapRover password",

      }

  }

<!-- 6. UNDER THE HOOD -->
<section id="inside">
  <div class="container">
    <div data-reveal>
      <h2 class="h2">Every call takes the same road. <span class="dim">Nothing skips a step.</span></h2>
    </div>
    <ol class="pipe" id="pipe" style="list-style:none;padding:0">
      <li class="step"><span class="step__dot">01</span><h3>Mode</h3><p>Is this operation registered in the current mode?</p></li>
      <li class="step"><span class="step__dot">02</span><h3>Schema</h3><p>Arguments are validated against the operation's schema.</p></li>
      <li class="step"><span class="step__dot">03</span><h3>Preview</h3><p>A dry run, or a confirmation token for deletes.</p></li>
      <li class="step"><span class="step__dot">04</span><h3>CapRover</h3><p>One adapter makes the API call.</p></li>
      <li class="step"><span class="step__dot">05</span><h3>Redaction</h3><p>Secrets are masked before the answer leaves.</p></li>
    </ol>
    <div class="under">
      <div>
        <h3>Private by construction</h3>
        <p>The only network traffic goes to your CAPROVER_URL. There is no telemetry.</p>
        <p>The server doesn't run commands on your machine or read files. It only reads environment variables.</p>
      </div>
      <div>
        <h3>Built to be read</h3>
        <p>TypeScript on Node. One class per operation, each with its schema, risk level and description, and a single manifest feeds every interface and the policy.</p>
        <p>The official caprover-api SDK is experimental, so only one adapter imports it. Integration tests run against a real, disposable CapRover.</p>
      </div>
    </div>
  </div>
</section>

<!-- 7. FAQ -->
<section id="faq">
  <div class="container faq">
    <div class="faq__head" data-reveal>
      <h2 class="h2">Questions <span class="dim">worth asking first.</span></h2>
    </div>
    <div>
      <details name="faq" open>
        <summary>Is this the official CapRover MCP?<svg class="ico"><use href="#i-plus"/></svg></summary>
        <p class="ans">No. It's unofficial and has no affiliation with CapRover.</p>
      </details>
      <details name="faq">
        <summary>Can the agent give itself more permissions?<svg class="ico"><use href="#i-plus"/></svg></summary>
        <p class="ans">No. The mode comes from an env var read when the server starts. Changing it means restarting the server, and the agent has no tool for that.</p>
      </details>
      <details name="faq">
        <summary>Why is there no “send any request” tool?<svg class="ico"><use href="#i-plus"/></svg></summary>
        <p class="ans">A raw request would walk around the mode, preview and redaction layers. The project records this decision as ADR 0003.</p>
      </details>
      <details name="faq">
        <summary>Does it work with two-factor auth?<svg class="ico"><use href="#i-plus"/></svg></summary>
        <p class="ans">Not yet. Servers with two-factor authentication aren't supported (ADR 0010).</p>
      </details>
      <details name="faq">
        <summary>Why does get_app_runtime fail on my server?<svg class="ico"><use href="#i-plus"/></svg></summary>
        <p class="ans">It needs a CapRover version that exposes that endpoint. CapRover 1.15.5 doesn't have it.</p>
      </details>
      <details name="faq">
        <summary>What's coming next?<svg class="ico"><use href="#i-plus"/></svg></summary>
        <p class="ans">The whole roadmap is done: <a href="https://github.com/guilhermebkel/better-caprover-mcp/issues/3" target="_blank" rel="noopener">#3</a> the rest of the CapRover API, <a href="https://github.com/guilhermebkel/better-caprover-mcp/issues/4" target="_blank" rel="noopener">#4</a> diagnose_app and find_issues, <a href="https://github.com/guilhermebkel/better-caprover-mcp/issues/5" target="_blank" rel="noopener">#5</a> a Code Mode with search and execute, and <a href="https://github.com/guilhermebkel/better-caprover-mcp/issues/6" target="_blank" rel="noopener">#6</a> remote HTTP (one CapRover server per MCP instance).</p>
      </details>
    </div>
  </div>
</section>

<script>
document.documentElement.classList.add('js');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Reveal */
const rv = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('is-in'); rv.unobserve(e.target); } }), { rootMargin: '0px 0px -10% 0px' });
document.querySelectorAll('[data-reveal], #pipe').forEach((el) => rv.observe(el));

/* Nav sheet */
const burger = document.getElementById('burger'), sheet = document.getElementById('sheet');
burger.addEventListener('click', () => { const o = sheet.classList.toggle('is-open'); burger.setAttribute('aria-expanded', o); burger.querySelector('use').setAttribute('href', o ? '#i-x' : '#i-menu'); });
sheet.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => { sheet.classList.remove('is-open'); burger.setAttribute('aria-expanded', 'false'); burger.querySelector('use').setAttribute('href', '#i-menu'); }));

/* Copy */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) { try { const x = document.createElement('textarea'); x.value = t; x.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(x); x.select(); const ok = document.execCommand('copy'); x.remove(); return ok; } catch (_) { return false; } }
}
document.querySelectorAll('[data-copy-from]').forEach((b) => b.addEventListener('click', async () => {
  const src = document.querySelector(b.dataset.copyFrom);
  const ok = await copyText(src.textContent.trim());
  const use = b.querySelector('use'), lbl = b.querySelector('.lbl'), prevIcon = use.getAttribute('href'), prevLbl = lbl && lbl.textContent;
  use.setAttribute('href', ok ? '#i-check' : '#i-copy'); b.classList.toggle('ok', ok);
  if (lbl) lbl.textContent = ok ? 'Copied' : 'Select and copy manually';
  setTimeout(() => { use.setAttribute('href', prevIcon); b.classList.remove('ok'); if (lbl) lbl.textContent = prevLbl; }, 1600);
}));

/* Generic tabs */
function tabs(list, onChange) {
  const btns = [...list.querySelectorAll('[role=tab]')];
  const select = (b, focus) => {
    btns.forEach((x) => { const on = x === b; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; document.getElementById(x.getAttribute('aria-controls')).hidden = !on; });
    if (focus) b.focus(); onChange && onChange(b);
  };
  btns.forEach((b, i) => {
    b.addEventListener('click', () => select(b));
    b.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); select(btns[(i + (e.key === 'ArrowRight' ? 1 : btns.length - 1)) % btns.length], true); } });
  });
}
tabs(document.querySelector('.install .tabs'));

/* Mode gate */
const gate = document.getElementById('gate'), modes = ['readonly', 'operate', 'admin'];
const notes = {
  readonly: "Write tools aren't registered. The model can't call what it never sees.",
  operate: "Apps can change but not be deleted. delete_app isn't registered.",
  admin: "delete_app exists, but it still asks for a confirmation token."
};
const radios = [...gate.querySelectorAll('[role=radio]')];
function setMode(m) {
  const idx = modes.indexOf(m); let n = 0;
  gate.dataset.mode = m; gate.style.setProperty('--idx', idx);
  radios.forEach((b) => { const on = b.dataset.mode === m; b.setAttribute('aria-checked', on); b.tabIndex = on ? 0 : -1; });
  gate.querySelectorAll('[data-lvl]').forEach((li) => { const on = +li.dataset.lvl <= idx; li.classList.toggle('is-on', on); if (on) n++; });
  document.getElementById('gate-count').textContent = n;
  document.getElementById('gate-list').textContent = 'tools/list → ' + n + ' tools';
  document.getElementById('gate-note').textContent = notes[m];
}
let auto = [];
const stopAuto = () => { auto.forEach(clearTimeout); auto = []; };
radios.forEach((b, i) => {
  b.addEventListener('click', () => { stopAuto(); setMode(b.dataset.mode); });
  b.addEventListener('keydown', (e) => {
    if (!['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(e.key)) return;
    e.preventDefault(); stopAuto();
    const j = (i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : 2)) % 3; setMode(modes[j]); radios[j].focus();
  });
});
if (!reduce) {
  auto = [setTimeout(() => setMode('operate'), 1900), setTimeout(() => setMode('admin'), 3600), setTimeout(() => setMode('readonly'), 5600)];
}

/* Transcript */
const term = document.getElementById('term'), panels = [...term.querySelectorAll('.term__panel')];
let timers = [], played = false;
function play() {
  timers.forEach(clearTimeout); timers = [];
  const p = panels.find((x) => !x.hidden); if (!p) return;
  const lines = [...p.querySelectorAll('.ln')];
  if (reduce) { lines.forEach((l) => l.classList.add('is-in')); return; }
  p.classList.add('pre'); lines.forEach((l) => l.classList.remove('is-in'));
  lines.forEach((l, i) => timers.push(setTimeout(() => l.classList.add('is-in'), 250 + i * 750)));
}
tabs(term.querySelector('.tabs'), () => { if (played) play(); });
document.getElementById('replay').addEventListener('click', () => { played = true; play(); });
if (!reduce) panels.forEach((p) => p.classList.add('pre'));
new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { played = true; play(); o.disconnect(); } }, { threshold: 0.4 }).observe(term);
</script>
